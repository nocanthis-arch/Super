workflows:
  android:
    name: Android build
    max_build_duration: 20
    instance_type: linux_x2
    environment:
      flutter: stable
    scripts:
      - name: Create Android files
        script: flutter create . --platforms=android --project-name fitlog && rm -rf test
      - name: Get packages
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release
      - name: Build AAB
        script: flutter build appbundle --release
    artifacts:
      - build/**/outputs/**/*.apk
      - build/**/outputs/**/*.aab
