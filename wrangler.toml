name = "social-app-api"
main = "worker.js"
compatibility_date = "2025-10-01"

[[d1_databases]]
binding = "DB"
database_name = "social-app-db"
database_id = "e67d232b-e6c6-4530-8ae2-1ea27b841786"

[vars]
MODERATION_MODEL = "openai/gpt-oss-safeguard-20b"
ALLOWED_ORIGIN = "*"

# Every 5 minutes: retry unreviewed posts and delete old rejected ones
[triggers]
crons = ["*/5 * * * *"]

[observability]
enabled = true

# The Groq key is NOT stored here. Add it as a secret:
#   npx wrangler secret put GROQ_API_KEY
