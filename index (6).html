<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Thing · Smart Chat</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============ THING v1 — white & black professional theme ============ */
:root{
  --bg:#ffffff; --bg2:#fafafa; --panel:#ffffff; --panel2:#f4f4f5; --panel3:#e9e9ec;
  --line:#e4e4e7; --line2:#d4d4d8; --txt:#18181b; --mut:#6e6e77; --mut2:#a1a1aa;
  --acc:#18181b; --good:#16a34a; --bad:#dc2626; --warn:#b45309;
  --f-sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,monospace;
  --shadow:0 10px 30px rgba(0,0,0,.08);
  --shadow-lg:0 18px 50px rgba(0,0,0,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--f-sans); background:var(--bg); color:var(--txt);
  overflow:hidden; -webkit-font-smoothing:antialiased; user-select:none;
}
#bgfx{position:fixed;inset:0;pointer-events:none;z-index:0;background:var(--bg)}
#bgfx::after{content:"";position:absolute;inset:0;
  background-image:linear-gradient(rgba(0,0,0,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,.025) 1px,transparent 1px);
  background-size:44px 44px; mask-image:radial-gradient(ellipse at 50% 20%,#000 20%,transparent 70%)}

/* ---------- TOP BAR ---------- */
.topbar{position:relative;z-index:60;height:60px;display:flex;align-items:center;gap:12px;
  padding:0 14px;border-bottom:1px solid var(--line);
  background:rgba(255,255,255,.88); backdrop-filter:blur(14px)}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;
  background:var(--panel);border:1px solid var(--line);color:var(--txt);cursor:pointer;transition:.18s}
.icon-btn:hover{background:var(--acc);color:#fff;border-color:var(--acc);transform:translateY(-1px)}
.icon-btn svg{width:19px;height:19px}
.brand{display:flex;align-items:center;gap:10px;margin:0 auto}
.brand-ic{width:34px;height:34px;border-radius:11px;background:var(--acc);display:grid;place-items:center;color:#fff}
.brand-ic svg{width:19px;height:19px}
.brand-name{font-weight:800;font-size:17px;letter-spacing:-.02em}
.brand-badge{font-family:var(--f-mono);font-size:9.5px;font-weight:700;letter-spacing:.1em;color:#fff;
  background:var(--acc);padding:2.5px 9px;border-radius:999px;text-transform:uppercase}

/* ---------- LAYOUT ---------- */
#app{position:relative;z-index:10;display:flex;height:calc(100dvh - 60px)}
#main{position:relative;flex:1;min-width:0;display:flex;flex-direction:column}

/* ---------- SIDEBAR (chats) ---------- */
#side{width:266px;flex-shrink:0;border-right:1px solid var(--line);background:var(--bg2);
  display:flex;flex-direction:column;transition:width .28s ease;overflow:hidden}
body.side-closed #side{width:0;border-right:none}
.side-head{display:flex;align-items:center;justify-content:space-between;padding:14px 14px 6px}
.side-title{font-size:14px;font-weight:800;letter-spacing:-.01em}
.side-head .icon-btn{width:32px;height:32px}
.new-chat{display:flex;align-items:center;justify-content:center;gap:8px;margin:8px 14px 4px;
  padding:10px;border-radius:13px;border:none;background:var(--acc);color:#fff;
  font-size:13px;font-weight:700;cursor:pointer;transition:.16s;font-family:var(--f-sans)}
.new-chat:hover{box-shadow:0 6px 18px rgba(0,0,0,.25);transform:translateY(-1px)}
#chatList{flex:1;overflow-y:auto;padding:8px 10px 14px;scrollbar-width:thin}
#chatList::-webkit-scrollbar{width:6px}
#chatList::-webkit-scrollbar-thumb{background:var(--line2);border-radius:99px}
.chat-item{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:11px;cursor:pointer;
  font-size:13px;color:var(--mut);transition:.14s;margin-bottom:3px;border:1px solid transparent}
.chat-item:hover{background:var(--panel);color:var(--txt);border-color:var(--line)}
.chat-item.active{background:var(--acc);color:#fff;border-color:var(--acc)}
.ci-title{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.ci-del{display:none;width:22px;height:22px;border-radius:7px;border:none;background:transparent;
  color:inherit;cursor:pointer;font-size:15px;line-height:1;flex-shrink:0;padding:0}
.chat-item:hover .ci-del{display:block}
.ci-del:hover{background:var(--bad);color:#fff}
.chat-item.active:hover .ci-del{color:#fff}
.chat-item.active .ci-del{display:none}
.side-foot{border-top:1px solid var(--line);padding:12px 16px}
.sf-row{display:flex;justify-content:space-between;align-items:center;padding:4px 0;
  font-size:11.5px;color:var(--mut);font-family:var(--f-mono)}
.sf-row b{color:var(--txt);font-weight:600}
@media(max-width:760px){
  #side{position:fixed;z-index:75;top:60px;bottom:0;left:0;width:280px;max-width:86vw;
    transform:translateX(-105%);transition:transform .3s ease;box-shadow:30px 0 60px rgba(0,0,0,.15);border-right:1px solid var(--line)}
  body:not(.side-closed) #side{transform:translateX(0)}
  body.side-closed #side{width:280px;transform:translateX(-105%);border-right:1px solid var(--line)}
}

/* ---------- CHAT ---------- */
#chat{flex:1;overflow-y:auto;overflow-x:hidden;padding:22px 16px 10px;
  scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
#chat::-webkit-scrollbar{width:7px}
#chat::-webkit-scrollbar-thumb{background:var(--line2);border-radius:99px}
#chat::-webkit-scrollbar-track{background:transparent}
.chat-inner{max-width:830px;margin:0 auto;display:flex;flex-direction:column;gap:18px;width:100%}

.msg-row{display:flex;width:100%;animation:msgIn .38s cubic-bezier(.22,1,.36,1)}
.msg-row.ai{justify-content:flex-start}
.msg-row.user{flex-direction:row-reverse;justify-content:flex-start}
@keyframes msgIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

.avatar{width:36px;height:36px;border-radius:11px;flex-shrink:0;display:grid;place-items:center}
.avatar svg{width:19px;height:19px}
.ai-av{background:var(--acc);color:#fff;border:1px solid var(--acc)}
.user-av{background:#fff;color:var(--acc);border:1.5px solid var(--acc)}
.msg-row.ai .avatar{margin-right:12px}
.msg-row.user .avatar{margin-left:12px}

.bubble{max-width:min(660px,calc(100% - 56px));padding:13px 16px;border-radius:18px;
  font-size:14.5px;line-height:1.62;word-wrap:break-word;overflow-wrap:anywhere;white-space:normal;user-select:text}
.msg-row.ai .bubble{background:var(--panel);border:1px solid var(--line);border-top-left-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.msg-row.user .bubble{background:var(--acc);color:#fff;border:1px solid var(--acc);border-top-right-radius:6px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.bubble b{font-weight:700}
.bubble .h-line{display:block;font-weight:800;color:var(--txt);margin:6px 0 4px}
.msg-row.user .bubble .h-line{color:#fff}
.inline-code{font-family:var(--f-mono);font-size:12.5px;background:var(--panel2);
  border:1px solid var(--line);padding:1px 6px;border-radius:6px;color:var(--txt)}
.msg-row.user .inline-code{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.25);color:#fff}
.code-block{display:block;margin:8px 0;padding:10px 12px;background:var(--bg2);border:1px solid var(--line);
  border-radius:10px;font-family:var(--f-mono);font-size:12px;line-height:1.55;overflow-x:auto;
  white-space:pre-wrap;word-break:break-all;color:var(--txt);max-width:100%}
.md-link{color:var(--txt);font-weight:600;text-decoration:underline;text-underline-offset:2px}
.msg-row.user .md-link{color:#fff}
.msg-time{display:flex;align-items:center;gap:5px;font-family:var(--f-mono);font-size:10.5px;
  color:var(--mut2);margin-top:7px}
.msg-row.user .msg-time{color:rgba(255,255,255,.55)}
.msg-time svg{width:11px;height:11px}
.um-img{display:block;max-width:250px;max-height:250px;border-radius:12px;border:1px solid rgba(255,255,255,.25)}

/* ---------- STATUS PILL ---------- */
#statusPill{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:40;
  display:none;align-items:center;gap:10px;padding:8px 16px 8px 9px;border-radius:999px;
  background:rgba(255,255,255,.96);border:1px solid var(--line2);box-shadow:var(--shadow-lg)}
#statusPill.show{display:flex;animation:dropIn .34s cubic-bezier(.34,1.56,.64,1)}
@keyframes dropIn{from{opacity:0;transform:translate(-50%,-14px) scale(.92)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
.s-icon{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--acc);color:#fff}
.s-icon svg{width:18px;height:18px}
.s-text{font-size:13.5px;font-weight:600;white-space:nowrap}
.s-time{font-family:var(--f-mono);font-size:11.5px;font-weight:600;color:var(--txt);
  background:var(--panel2);border:1px solid var(--line);padding:3px 9px;border-radius:999px}

/* brain still — white shine sweeps bottom-left → top-right every 2.5s */
#statusPill[data-phase="think"] .s-icon{position:relative;overflow:hidden}
#statusPill[data-phase="think"] .s-icon::after{
  content:"";position:absolute;width:36%;height:170%;left:-45%;bottom:-35%;
  background:linear-gradient(115deg,transparent 20%,rgba(255,255,255,.95) 50%,transparent 80%);
  transform:skewX(-6deg);opacity:0;animation:shineSweep 2.5s ease-in-out infinite}
@keyframes shineSweep{
  0%{left:-45%;bottom:-35%;opacity:0}
  12%{opacity:.95}
  62%{left:120%;bottom:135%;opacity:.95}
  64%{opacity:0}
  100%{left:120%;bottom:135%;opacity:0}}
#statusPill[data-phase="work"] .s-icon svg{transform-origin:82% 16%;animation:swing .9s ease-in-out infinite}
@keyframes swing{0%,100%{transform:rotate(0)}50%{transform:rotate(-40deg)}}
#statusPill[data-phase="error"] .s-icon,#statusPill[data-phase="net"] .s-icon{background:var(--bad)}
#statusPill[data-phase="error"] .s-icon,#statusPill[data-phase="net"] .s-icon{animation:shakeX .5s ease}
#statusPill[data-phase="error"] .s-text,#statusPill[data-phase="net"] .s-text{color:var(--bad)}
#statusPill[data-phase="error"] .s-time,#statusPill[data-phase="net"] .s-time{color:var(--bad);border-color:rgba(220,38,38,.3);background:rgba(220,38,38,.06)}
@keyframes shakeX{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}

#chatHiddenHint{display:none;position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:35;
  font-size:12px;color:var(--mut);background:var(--panel);border:1px solid var(--line);
  padding:7px 16px;border-radius:999px;box-shadow:var(--shadow)}
body.chat-hidden #chat{display:none}
body.chat-hidden #chatHiddenHint{display:block}

/* ---------- COMPOSER ---------- */
#composerWrap{position:relative;z-index:50;padding:6px 16px 10px}
.composer-inner{max-width:830px;margin:0 auto;position:relative}
#popup{position:absolute;bottom:calc(100% + 8px);left:0;width:min(430px,100%);
  max-height:190px;overflow-y:auto;background:var(--panel);border:1px solid var(--line2);
  border-radius:16px;padding:6px;display:none;box-shadow:var(--shadow-lg);scrollbar-width:thin}
#popup.show{display:block;animation:popIn .18s ease}
@keyframes popIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#popup::-webkit-scrollbar{width:6px}
#popup::-webkit-scrollbar-thumb{background:var(--line2);border-radius:99px}
.sp-item{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:11px;cursor:pointer;transition:.13s}
.sp-item:hover{background:var(--panel2)}
.sp-item .cmd-ic{width:32px;height:32px;border-radius:9px;background:var(--panel2);
  border:1px solid var(--line);display:grid;place-items:center;color:var(--txt);flex-shrink:0}
.sp-item .cmd-ic svg{width:16px;height:16px}
.sp-item .com-ic{width:32px;height:32px;border-radius:9px;background:var(--panel2);
  border:1px solid var(--line);display:grid;place-items:center;font-size:19px;flex-shrink:0}
.sp-item .cmd-name{font-family:var(--f-mono);font-size:12.5px;font-weight:700;color:var(--txt)}
.sp-item .cmd-desc{font-size:11px;color:var(--mut);margin-top:1px}

.composer{display:flex;align-items:flex-end;gap:8px;background:var(--panel);border:1px solid var(--line2);
  border-radius:20px;padding:9px 9px 9px 10px;box-shadow:var(--shadow);transition:border-color .2s, box-shadow .2s}
.composer:focus-within{border-color:var(--acc);box-shadow:0 0 0 3px rgba(24,24,27,.1),var(--shadow)}
#input{flex:1;background:transparent;border:none;outline:none;resize:none;color:var(--txt);
  font-family:var(--f-sans);font-size:14.5px;line-height:1.5;max-height:150px;user-select:text;padding:8px 4px}
#input::placeholder{color:var(--mut2)}
.composer-btn{width:40px;height:42px;border-radius:13px;background:var(--panel2);border:1px solid var(--line);
  color:var(--txt);cursor:pointer;display:grid;place-items:center;flex-shrink:0;transition:.16s}
.composer-btn:hover{background:var(--acc);color:#fff;border-color:var(--acc)}
.composer-btn svg{width:18px;height:18px}
.composer-btn.listening{background:var(--bad);border-color:var(--bad);color:#fff;animation:pulseMic 1.1s ease-in-out infinite}
@keyframes pulseMic{0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,.45)}50%{box-shadow:0 0 0 9px rgba(220,38,38,0)}}
.send-btn{width:42px;height:42px;border-radius:14px;background:var(--acc);border:none;cursor:pointer;
  display:grid;place-items:center;color:#fff;flex-shrink:0;transition:.18s;box-shadow:0 4px 12px rgba(0,0,0,.22)}
.send-btn:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 8px 20px rgba(0,0,0,.3)}
.send-btn:active{transform:scale(.95)}
.send-btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.send-btn svg{width:19px;height:19px}
.hint{text-align:center;font-size:10.5px;color:var(--mut2);margin-top:7px;font-family:var(--f-mono);letter-spacing:.02em}

/* ---------- SETTINGS PANEL (right) ---------- */
#settingsPanel{position:absolute;right:0;top:0;bottom:0;width:330px;max-width:88vw;z-index:80;
  background:var(--panel);border-left:1px solid var(--line2);transform:translateX(103%);
  transition:transform .32s cubic-bezier(.22,1,.36,1);display:flex;flex-direction:column;
  box-shadow:-30px 0 60px rgba(0,0,0,.12)}
#settingsPanel.open{transform:translateX(0)}
.sp-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;
  border-bottom:1px solid var(--line)}
.sp-head h2{font-size:16px;font-weight:800}
.sp-body{flex:1;overflow-y:auto;padding:16px 14px 20px;scrollbar-width:thin}
.sp-body::-webkit-scrollbar{width:6px}
.sp-body::-webkit-scrollbar-thumb{background:var(--line2);border-radius:99px}
.sp-section{margin-bottom:22px}
.sp-section h3{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  color:var(--mut);margin:0 6px 10px}
.engine-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px 14px}
.ec-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;
  border-bottom:1px solid var(--line);font-size:12.5px;color:var(--mut)}
.ec-row:last-child{border-bottom:none}
.ec-row b{color:var(--txt);font-family:var(--f-mono);font-size:11.5px;font-weight:600}
.on-tag{color:#fff;font-family:var(--f-mono);font-size:10px;font-weight:700;
  background:var(--acc);padding:2.5px 8px;border-radius:999px;letter-spacing:.06em}
.tgl{width:38px;height:21px;border-radius:999px;background:var(--panel3);border:1px solid var(--line2);
  cursor:pointer;position:relative;transition:.2s;flex-shrink:0}
.tgl span{position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:var(--mut2);
  transition:.2s cubic-bezier(.34,1.56,.64,1)}
.tgl.on{background:var(--acc);border-color:var(--acc)}
.tgl.on span{left:19px;background:#fff}
.danger-btn{width:100%;padding:11px;border-radius:13px;font-size:12.5px;font-weight:600;
  cursor:pointer;transition:.18s;border:1px solid var(--line);color:var(--bad);background:var(--panel);font-family:var(--f-sans)}
.danger-btn:hover{background:rgba(220,38,38,.07);border-color:var(--bad)}
#overlay{position:absolute;inset:0;z-index:70;background:rgba(0,0,0,.25);backdrop-filter:blur(2px);
  opacity:0;pointer-events:none;transition:opacity .3s}
#overlay.show{opacity:1;pointer-events:auto}

/* ---------- CARDS ---------- */
.coin-card{margin-top:12px;background:var(--panel);border:1px solid var(--line2);
  border-radius:18px;padding:15px 15px 12px;box-shadow:var(--shadow)}
.coin-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.coin-id{display:flex;align-items:center;gap:10px}
.coin-id img{width:38px;height:38px;border-radius:50%;background:var(--panel2);border:1px solid var(--line2)}
.com-ic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:20px;
  border:1px solid var(--line2);flex-shrink:0}
.coin-name{font-weight:800;font-size:14px}
.coin-sym{font-family:var(--f-mono);font-size:10.5px;color:var(--mut);letter-spacing:.08em;margin-top:1px}
.coin-right{text-align:right}
.coin-price{font-family:var(--f-mono);font-size:21px;font-weight:700;letter-spacing:-.02em}
.coin-delta{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-mono);font-size:11.5px;
  font-weight:700;padding:3px 9px;border-radius:8px;margin-top:5px}
.coin-delta span{font-weight:400;opacity:.75}
.coin-delta.up{color:var(--good);background:rgba(22,163,74,.08);border:1px solid rgba(22,163,74,.3)}
.coin-delta.down{color:var(--bad);background:rgba(220,38,38,.08);border:1px solid rgba(220,38,38,.3)}
.coin-tfs{display:flex;gap:5px;margin:13px 0 9px}
.coin-tf{font-family:var(--f-mono);font-size:10.5px;font-weight:700;letter-spacing:.06em;
  padding:4px 12px;border-radius:999px;border:1px solid var(--line);background:transparent;
  color:var(--mut);cursor:pointer;transition:.15s}
.coin-tf:hover{color:var(--txt)}
.coin-tf.on{color:#fff;background:var(--acc);border-color:var(--acc)}
.coin-chart{position:relative;height:150px;border-radius:10px;overflow:hidden;background:var(--bg2);
  border:1px solid var(--line)}
.coin-chart svg{width:100%;height:100%;display:block}
.coin-live{position:absolute;top:9px;right:11px;display:flex;align-items:center;gap:6px;
  font-family:var(--f-mono);font-size:9.5px;font-weight:700;letter-spacing:.14em;color:var(--good)}
.coin-live .dot{width:6px;height:6px;border-radius:50%;background:var(--good);
  box-shadow:0 0 8px rgba(22,163,74,.7);animation:pulseDot 1.6s ease-in-out infinite}
@keyframes pulseDot{0%,100%{opacity:1}50%{opacity:.25}}
.coin-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding-top:11px;margin-top:11px;
  border-top:1px solid var(--line)}
.coin-stats div{display:flex;flex-direction:column;gap:3px}
.coin-stats span{font-size:9.5px;color:var(--mut2);text-transform:uppercase;letter-spacing:.08em;font-family:var(--f-mono)}
.coin-stats b{font-family:var(--f-mono);font-size:11.5px;font-weight:600;color:var(--txt)}

.img-card{margin-top:12px;border-radius:18px;overflow:hidden;border:1px solid var(--line2);
  background:var(--panel);max-width:100%;box-shadow:var(--shadow)}
.img-main{display:block;width:100%;height:auto;max-height:430px;object-fit:cover;background:var(--bg2)}
.img-actions{display:flex;gap:8px;padding:10px;flex-wrap:wrap}
.btn-a{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:11px;
  font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--line2);background:var(--panel);
  color:var(--txt);transition:.16s;font-family:var(--f-sans)}
.btn-a:hover{border-color:var(--acc);background:var(--panel2);transform:translateY(-1px)}
.btn-a svg{width:14px;height:14px}
.btn-a.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn-a.pri:hover{box-shadow:0 6px 18px rgba(0,0,0,.25)}

<div id="app">

/* ---------------- DOM ---------------- */
const $ = s => document.querySelector(s);
const chat = $('#chat'), chatInner = $('#chatInner'), input = $('#input'),
      sendBtn = $('#sendBtn'), popup = $('#popup'), statusPill = $('#statusPill'),
      sIcon = statusPill.querySelector('.s-icon'), sText = statusPill.querySelector('.s-text'),
      sTime = statusPill.querySelector('.s-time'), toast = $('#toast'),

      chatList = $('#chatList'), micBtn = $('#micBtn'), attachBtn = $('#attachBtn'),
      hintBar = $('#hintBar');

$('#brandIc').innerHTML = IC.brain;
$('#hideChats').innerHTML = IC.eyeOff;
$('#settingsBtn').innerHTML = IC.gear;
$('#closeSettings').innerHTML = IC.x;
$('#sendBtn').innerHTML = IC.send;
$('#menuBtn').innerHTML = IC.menu;
micBtn.innerHTML = IC.mic;
attachBtn.innerHTML = IC.paperclip;

/* ---------------- STATE ---------------- */
let busy = false, t0 = 0, tInt = null, thinkTimer = null, hiddenChats = false;
let webOn = localStorage.getItem('thing_web') !== '0';
let MEMORY = [];
function loadMemory(){ try{ MEMORY = JSON.parse(localStorage.getItem('thing_memory')||'[]')||[]; }catch(e){ MEMORY=[]; } }
function saveMemory(){ try{ localStorage.setItem('thing_memory', JSON.stringify(MEMORY)); }catch(e){} }
loadMemory();

/* chats */
let chats = [];
let cur = null;
function loadChats(){
  try{ chats = JSON.parse(localStorage.getItem('thing_chats')||'[]')||[]; }catch(e){ chats=[]; }
  chats.forEach(c => { c.msgs = c.msgs || []; c.hist = c.hist || []; c.lastDeep = c.lastDeep || null; });
  const curId = localStorage.getItem('thing_cur');
  cur = chats.find(c => c.id === curId) || chats[0] || null;
}
function saveChats(){
  try{
    const slim = chats.map(c => ({ id:c.id, title:c.title, t:c.t, titled:c.titled,
      lastDeep:c.lastDeep, hist:(c.hist||[]).slice(-20), msgs:c.msgs.slice(-60) }));
    localStorage.setItem('thing_chats', JSON.stringify(slim));
    if(cur) localStorage.setItem('thing_cur', cur.id);
  }catch(e){ toastMsg('Storage full — very old chats may not persist'); }
}
function getDeep(){ return cur ? cur.lastDeep : null; }
function setDeep(v){ if(cur){ cur.lastDeep = v; saveChats(); } }

/* ---------------- SYSTEM ---------------- */
const SYSTEM = "You are Thing, a smart assistant running on the Thing v1 engine. Be concise, warm and helpful.\n" +
  "RULES:\n" +
  "- Use **bold** for emphasis, short bullet lists and clear structure. Keep answers compact.\n" +
  "- NEVER mention model names, providers, tokens, keys or internal app design. Talk like a natural helper.\n" +
  "- If [CURRENT LIVE SEARCH DATA] is provided, treat it as your primary source and keep answers fresh.\n" +
  "- Use [MEMORY ABOUT THE USER] to personalise your answers when relevant.\n" +
  "- If the user asks for real-time facts (weather, prices, news, location) and no live data covers it, say clearly you cannot get live info right now instead of guessing.\n" +
  "- If a request is unclear, ask one short question.\n" +
  "- Never say you searched the web unless the user asks about your sources.";

function buildSystem(){
  let s = SYSTEM;
  if(MEMORY.length){
    s += '\n\n[MEMORY ABOUT THE USER — use these to give better, more personal answers]\n' + MEMORY.map(m=>'- '+m).join('\n');
  }
  if(!webOn){
    s += '\n\n[NOTE: live web search is currently switched OFF by the user. If a question needs fresh live data you cannot access, say so honestly instead of guessing.]';
  }
  return s;
}

/* ---------------- COMMANDS (always enabled) ---------------- */

/* ---------------- UTILS ---------------- */
function escapeHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function toastMsg(m){
  toast.textContent = m;
  toast.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>toast.classList.remove('show'), 2400);
}
function scrollBottom(){
  requestAnimationFrame(()=>{ chat.scrollTop = chat.scrollHeight; });
}
function fmtPrice(n){
  if(n == null) return '—';
  return n >= 1000 ? n.toLocaleString('en-US',{maximumFractionDigits:2})
       : n >= 1 ? n.toFixed(2) : n.toFixed(4);
}
function fmtVol(n){
  if(n == null) return '—';
  if(n >= 1e9) return '$'+(n/1e9).toFixed(2)+'B';
  if(n >= 1e6) return '$'+(n/1e6).toFixed(1)+'M';
  return '$'+Math.round(n).toLocaleString('en-US');
}
async function fjson(url, opts){
  let r;
  try { r = await fetch(url, opts||{}); }
  catch(e){ throw { type:'network' }; }
  if(!r.ok) throw { type:'api', status:r.status };
  return r.json();
}
function startTimer(){
  t0 = performance.now();
  sTime.textContent = '0.0 s';
  tInt = setInterval(()=>{
    sTime.textContent = ((performance.now()-t0)/1000).toFixed(1) + ' s';
  }, 90);
}
function stopTimer(){
  clearInterval(tInt);
  return (performance.now()-t0)/1000;
}
function timeStr(t){ return t.toFixed(1)+' s'; }

/* ---------------- STATUS ENGINE ---------------- */
function setStatus(phase, text){
  clearTimeout(thinkTimer);
  if(phase === 'idle'){
    statusPill.classList.remove('show');
    statusPill.dataset.phase = '';
    return;
  }
  const map = {
    think:{ t:'Thinking…', ic:IC.brain },
    work:{ t:'Working…', ic:IC.hammer },
    error:{ t:text||'Error found', ic:IC.err },
    net:{ t:'Network connection error', ic:IC.err }
  };
  const m = map[phase] || map.error;
  statusPill.dataset.phase = phase;
  sIcon.innerHTML = m.ic;
  sText.textContent = m.t;
  statusPill.classList.add('show');
}

/* ---------------- MESSAGE RENDERING ---------------- */
function renderAI(t){
  const parts = String(t).split(/```/);
  let out = '';
  for(let i=0;i<parts.length;i++){
    if(i%2===1){
      out += '<pre class="code-block">'+escapeHtml(parts[i].replace(/^\n/,''))+'</pre>';
    } else {
      out += escapeHtml(parts[i])
        .replace(/^#{1,4}\s+(.+)$/gm,'<span class="h-line">$1</span>')
        .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')
        .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener" class="md-link">$1</a>')
        .replace(/`([^`]+)`/g,'<code class="inline-code">$1</code>')
        .replace(/\n/g,'<br>');
    }
  }
  return out;
}
function rowHTML(side, inner){
  return '<div class="msg-row '+(side==='user'?'user':'ai')+'">' +
    (side==='user' ? '<div class="avatar user-av">'+IC.user+'</div>' : '<div class="avatar ai-av">'+IC.brain+'</div>') +
    '<div class="bubble">'+inner+'</div></div>';
}
function addMsg(side, inner){
  const row = document.createElement('div');
  row.innerHTML = rowHTML(side, inner);
  chatInner.appendChild(row);
  if(cur){
    cur.msgs.push({ r: side, h: inner });
    saveChats();
    renderChatList();
  }
  scrollBottom();
  return row;
}
function addUser(text, inner){
  addMsg('user', inner || escapeHtml(text).replace(/\n/g,'<br>'));
  if(cur){
    if(!cur.titled && text){ cur.title = text.slice(0,40); cur.titled = true; }
    cur.hist.push({role:'user', content:text});
    saveChats();
  }
}
function addAI(text, extraNode, seconds){

async function extractMemory(userText, reply){

    const content = await groqChat([
      { role:'system', content:'You extract personal facts about the USER from a conversation (their name, projects, interests, preferences, occupation, location, goals, favourites). Reply with ONLY a valid JSON array of short fact strings like ["User name is Alex", "User is building a food app"]. Reply [] if nothing new. Facts must be useful context for future chats.' },

    ], 150);
    const m = content.match(/\[[\s\S]*\]/);

const ENGINES = [

];
const MODEL = 'llama-3.1-8b-instant';
const VISION_MODEL = 'llama-3.2-11b-vision-preview';

async function groqChat(messages, maxTokens){
  maxTokens = maxTokens || 1100;
  let lastErr = null;
  for(let i=0;i<ENGINES.length;i++){
    const key = ENGINES[i];
    let res;
    try{
      res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
        method:'POST',
        headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+key },
        body: JSON.stringify({ model:MODEL, messages:messages, temperature:0.6, max_tokens:maxTokens })
      });
    }catch(e){
      throw { type:'network' };
    }
    if(res.ok){
      const data = await res.json();
      return data.choices[0].message.content;
    }
    if([429,401,403,500,503].indexOf(res.status) !== -1){
      lastErr = { type:'api', status:res.status };
      continue;
    }
    throw { type:'api', status:res.status };
  }
  throw lastErr || { type:'api', status:0 };
}

/* ---------------- AUTO WEB SEARCH (hidden, top 10 results) ---------------- */
let __cbId = 0;
function ddgInstant(q){
  return new Promise(res => {
    const cb = '__ddg' + (++__cbId);
    const s = document.createElement('script');
    let done = false;
    const cleanup = () => { try{ delete window[cb]; }catch(e){} if(s.parentNode) s.parentNode.removeChild(s); };
    window[cb] = data => {
      done = true; cleanup();
      try{
        let out = '';
        if(data.AbstractText) out += 'Search: ' + data.AbstractText;
        else if(data.Answer) out += 'Search answer: ' + data.Answer;
        else if(data.Heading) out += 'Search: ' + data.Heading + ' — ' + (data.Abstract || '');
        if(data.RelatedTopics && data.RelatedTopics.length){
          out += '\nRelated: ' + data.RelatedTopics.slice(0,5).map(t => t.Text||t.Name||'').filter(Boolean).join(' | ');
        }
        res(out.slice(0,1800));
      }catch(e){ res(''); }
    };
    s.onerror = () => { if(!done){ cleanup(); res(''); } };
    s.src = 'https://api.duckduckgo.com/?q=' + encodeURIComponent(q) + '&format=json&no_html=1&skip_disambig=1&callback=' + cb;
    document.head.appendChild(s);
    setTimeout(()=>{ if(!done){ cleanup(); res(''); } }, 6000);
  });
}
async function ddgHtml(q){
  try{
    const r = await fetch('https://html.duckduckgo.com/html/?q=' + encodeURIComponent(q), { headers:{ 'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36' } });
    if(!r.ok) return { text:'', topUrl:'' };
    const doc = new DOMParser().parseFromString(await r.text(), 'text/html');
    const items = [];
    doc.querySelectorAll('.result').forEach((el,i) => {
      if(i >= 10) return;
      const a = el.querySelector('.result__a');
      const sn = el.querySelector('.result__snippet');
      let url = a ? a.getAttribute('href') : '';
      try{
        if(url){
          const u = new URL(url, 'https://duckduckgo.com');
          url = u.searchParams.get('uddg') ? decodeURIComponent(u.searchParams.get('uddg')) : url;
        }
      }catch(e){}
      items.push({ title: a ? a.textContent.trim() : '', url: url, sn: sn ? sn.textContent.trim() : '' });
    });
    const text = items.length
      ? 'Top web results:\n' + items.map((x,i)=>(i+1)+') '+x.title+(x.sn?' — '+x.sn:'')).join('\n')
      : '';
    return { text: text.slice(0,2600), topUrl: (items[0] && items[0].url) || '' };
  }catch(e){ return { text:'', topUrl:'' }; }
}
async function wikiQuick(q){
  try{
    const r = await fetch('https://en.wikipedia.org/w/api.php?action=opensearch&search='+encodeURIComponent(q)+'&limit=1&format=json&origin=*');
    const j = await r.json();
    const title = j[1] && j[1][0];
    if(!title) return '';
    const r2 = await fetch('https://en.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(title));

    return 'Wikipedia ('+title+'): ' + ((s.extract||'').slice(0,1100));

async function webSearch(q){
  const parts = await Promise.all([ddgInstant(q), wikiQuick(q), ddgHtml(q)]);
  let text = '';
  if(parts[0]) text += parts[0] + '\n';
  if(parts[1]) text += parts[1] + '\n';
  if(parts[2].text) text += parts[2].text;
  return { text: text || 'No live results available for this query.', topUrl: parts[2].topUrl || '' };
}

  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%^&*()_+-=';
  const arr = new Uint32Array(len);
  crypto.getRandomValues(arr);

  const r = j.chart && j.chart.result && j.chart.result[0];
  if(!r) throw { type:'api' };
  return r;
}
async function fetchCommodity(arg){
  const a = (arg||'').trim().toLowerCase();
  const tok = a.split(/\s+/)[0] || a;
  let com = COMS.find(c => c.id === a || c.n.toLowerCase() === a || (c.aliases||[]).indexOf(a) !== -1);
  if(!com) com = COMS.find(c => c.id === tok || (c.aliases||[]).indexOf(tok) !== -1 || c.n.toLowerCase().indexOf(tok) !== -1);
  if(!com) throw { type:'api' };
  const tfs = [['1D','1d','5m'],['1W','5d','15m'],['1M','1mo','1d'],['3M','3mo','1wk']];
  const out = { com:com, pts:{} };
  let meta = null;
  for(const [k, rng, intv] of tfs){
    try{
      const r = await yahooChart(com.s, rng, intv);
      if(!meta) meta = r.meta || {};
      const ts = r.timestamp || [];
      const closes = (r.indicators && r.indicators.quote && r.indicators.quote[0] && r.indicators.quote[0].close) || [];
      const pts = [];
      for(let i=0;i<ts.length;i++){
        if(closes[i] != null) pts.push([i, closes[i]]);
      }
      if(pts.length > 90) pts.splice(0, pts.length-90);
      out.pts[k] = pts;
    }catch(e){ out.pts[k] = []; }
  }
  if(!meta){
    /* Yahoo blocked → fallback to free metals API (gold/silver/platinum/palladium) */
    if(com.gsym){
      const j = await fjson('https://api.gold-api.com/price/'+com.gsym);
      return {
        com:com, price: j.price, change: 0, high: null, low: null,
        updated: new Date(j.updatedAt).getTime(),
        pts:{ '1D':[], '1W':[], '1M':[], '3M':[] }
      };
    }
    throw { type:'api' };
  }
  const price = meta.regularMarketPrice != null ? meta.regularMarketPrice : null;
  const prev = meta.chartPreviousClose != null ? meta.chartPreviousClose : meta.previousClose;
  const change = (price != null && prev) ? ((price - prev)/prev)*100 : 0;
  return {
    com:com, price: price, change: change,
    high: meta.regularMarketDayHigh != null ? meta.regularMarketDayHigh : null,
    low: meta.regularMarketDayLow != null ? meta.regularMarketDayLow : null,
    updated: meta.regularMarketTime ? meta.regularMarketTime*1000 : Date.now(),
    pts: out.pts
  };
}

/* ---------------- SPARKLINE (crypto + commodity charts) ---------------- */
function drawSpark(svg, pts, up){
  const color = up ? '#16a34a' : '#dc2626';
  if(!pts || pts.length < 2){
    svg.innerHTML = '<text x="300" y="105" fill="#a1a1aa" font-size="13" text-anchor="middle" font-family="JetBrains Mono">No chart data</text>';
    return;
  }
  const vals = pts.map(p=>p[1]);
  const mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals);
  const W = 600, H = 200, pad = 9;
  const rng = (mx - mn) || 1;
  const coords = pts.map((p,i)=>[ (i/(pts.length-1))*W, pad + (1 - (p[1]-mn)/rng) * (H - pad*2) ]);
  const line = coords.map((c,i)=>(i?'L':'M')+c[0].toFixed(1)+','+c[1].toFixed(1)).join(' ');
  const last = coords[coords.length-1];
  const area = line + ' L600,200 L0,200 Z';
  const gid = 'cg' + Math.random().toString(36).slice(2,8);
  svg.innerHTML =
    '<defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0" stop-color="'+color+'" stop-opacity="0.22"/>' +
      '<stop offset="1" stop-color="'+color+'" stop-opacity="0"/>' +
    '</linearGradient></defs>' +
    '<path d="'+area+'" fill="url(#'+gid+')"/>' +
    '<path d="'+line+'" fill="none" stroke="'+color+'" stroke-width="2.4" stroke-linecap="round"/>' +
    '<circle cx="'+last[0].toFixed(1)+'" cy="'+last[1].toFixed(1)+'" r="4" fill="'+color+'">' +
      '<animate attributeName="r" values="3;6;3" dur="1.7s" repeatCount="indefinite"/>' +
      '<animate attributeName="opacity" values="1;0.35;1" dur="1.7s" repeatCount="indefinite"/>' +
    '</circle>';
}

async function genImage(prompt){
  const seed = Math.floor(Math.random()*1000000);
  const url = 'https://image.pollinations.ai/prompt/'+encodeURIComponent(prompt)+'?width=1024&height=1024&nologo=true&seed='+seed;
  let src = url;
  try{
    const r = await fetch(url);
    if(!r.ok) throw { type:'api' };
    const b = await r.blob();
    if(b && b.size > 0) src = URL.createObjectURL(b);
  }catch(e){
    if(e && e.type === 'api') throw e;
  }
  return { src };
}

async function downloadImage(src, name){
  try{
    const r = await fetch(src, { mode:'cors' });
    if(r.ok){
      const b = await r.blob();
      const u = URL.createObjectURL(b);
      const a = document.createElement('a');
      a.href = u; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(u), 4000);
      toastMsg('Downloaded ✓');
      return;
    }
  }catch(e){}
  const a = document.createElement('a');
  a.href = src; a.target = '_blank'; a.rel = 'noopener'; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
}

/* ---------------- IMAGE UPLOAD → VISION DESCRIPTION ---------------- */
function fileToDataUrl(file, maxDim){
  maxDim = maxDim || 900;
  return new Promise(res => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, maxDim/Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.width*s));
      c.height = Math.max(1, Math.round(img.height*s));
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      res(c.toDataURL('image/jpeg', 0.85));
      URL.revokeObjectURL(url);
    };
    img.onerror = () => { res(null); URL.revokeObjectURL(url); };
    img.src = url;
  });
}
function imgToPixels(file, maxDim){
  maxDim = maxDim || 1200;
  return new Promise(res => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, maxDim/Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.width*s));
      c.height = Math.max(1, Math.round(img.height*s));
      const ctx = c.getContext('2d');
      ctx.drawImage(img, 0, 0, c.width, c.height);
      let d = null;
      try{ d = ctx.getImageData(0,0,c.width,c.height); }catch(e){}
      res(d);
      URL.revokeObjectURL(url);
    };
    img.onerror = () => { res(null); URL.revokeObjectURL(url); };
    img.src = url;
  });
}
function pickImage(){
  return new Promise(res => {

    fi.accept = 'image/*';
    fi.onchange = () => res(fi.files && fi.files[0] ? fi.files[0] : null);
    fi.click();

}
function zxDecode(d, formats){
  if(typeof ZXing === 'undefined' || !d) return null;
  try{
    const hints = new Map();
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, formats);
    hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
    const lum = new ZXing.RGBLuminanceSource(d.data, d.width, d.height);
    const bmp = new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(lum));
    const reader = new ZXing.MultiFormatReader();
    reader.setHints(hints);
    const r = reader.decode(bmp);
    return r ? r.getText() : null;
  }catch(e){ return null; }
}
async function decodeQR(file){
  const d = await imgToPixels(file);
  if(!d) return null;
  if(typeof jsQR !== 'undefined'){
    try{
      const code = jsQR(d.data, d.width, d.height);
      if(code && code.data) return code.data;
    }catch(e){}
  }
  if(typeof ZXing !== 'undefined'){
    return zxDecode(d, [ZXing.BarcodeFormat.QR_CODE]);
  }
  return null;
}
async function decodeBarcode(file){
  const d = await imgToPixels(file);
  if(!d || typeof ZXing === 'undefined') return null;
  return zxDecode(d, [
    ZXing.BarcodeFormat.CODE_128, ZXing.BarcodeFormat.CODE_39, ZXing.BarcodeFormat.CODE_93,
    ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.EAN_8, ZXing.BarcodeFormat.UPC_A,
    ZXing.BarcodeFormat.UPC_E, ZXing.BarcodeFormat.ITF, ZXing.BarcodeFormat.CODABAR
  ]);
}

/* ---------------- VOICE INPUT (free built-in speech engine) ---------------- */
let rec = null, voiceBase = '', finalAcc = '';
function initVoice(){
  try{
    const S = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!S) return;
    rec = new S();
    rec.continuous = true;
    rec.interimResults = true;
    rec.lang = 'en-US';
    rec.onresult = e => {
      let interim = '';
      for(let i=e.resultIndex;i<e.results.length;i++){
        const r = e.results[i];
        if(r.isFinal) finalAcc += r[0].transcript;
        else interim += r[0].transcript;
      }
      input.value = voiceBase + finalAcc + interim;
      autoGrow();
    };
    rec.onerror = () => { micBtn.classList.remove('listening'); finalAcc=''; };
    rec.onend = () => { micBtn.classList.remove('listening'); finalAcc=''; };
  }catch(e){ rec = null; }
}
initVoice();
micBtn.addEventListener('click', () => {
  if(!rec){ toastMsg('Voice input is not supported in this browser'); return; }
  if(micBtn.classList.contains('listening')){
    try{ rec.stop(); }catch(e){}
    return;
  }
  voiceBase = input.value + (input.value ? ' ' : '');
  finalAcc = '';
  try{
    rec.start();
    micBtn.classList.add('listening');
  }catch(e){ toastMsg('Could not start the microphone'); }
});

/* ---------------- STANDARD COMMAND RUNNER (AI fallback) ---------------- */
async function runStd(name, arg, o){
  let live = null, failed = false;
  if(o.fetcher){
    try{ live = await o.fetcher(arg); }
    catch(e){
      if(e && e.type === 'network'){
        stopTimer(); setStatus('net');
        addAI('⚠️ **Network connection error** — check your internet and try again.');
        setTimeout(()=>setStatus('idle'), 6000);
        busy = false;
        return;
      }
      failed = true;
    }
  }
  if(failed || live === null){
    busy = false; stopTimer();
    await modelAnswer(('/'+name+' '+(arg||'')).trim());
    return;
  }
  try{
    if(o.direct){
      const t = stopTimer();
      setStatus('idle');
      const txt = o.direct(live, arg);
      addAI(txt, null, t);
      pushHistory('assistant', txt);
      busy = false;
      return;
    }
    setStatus('think');
    thinkTimer = setTimeout(()=>setStatus('work'), 7000);
    const messages = [
      { role:'system', content: buildSystem() + '\n\n' + o.sys },
      ...recentHistory(),
      { role:'user', content: (o.userLine ? o.userLine(arg) : '') + '\n\nLIVE DATA:\n' + JSON.stringify(live).slice(0,6000) }
    ];
    const reply = await groqChat(messages);
    clearTimeout(thinkTimer);
    const t = stopTimer();
    setStatus('idle');
    addAI(reply, o.card ? o.card(live, arg) : null, t);
    pushHistory('assistant', reply);
    if(o.after) o.after(live, arg);
    extractMemory('/'+name+' '+(arg||''), reply);
    busy = false;
  }catch(e){
    clearTimeout(thinkTimer); stopTimer();
    if(e && e.type === 'network'){
      setStatus('net');
      addAI(o.netMsg || '⚠️ **Network connection error** — check your internet and try again.');
    }else{
      setStatus('error');
      addAI(o.errMsg || '⚠️ **Error found** — I could not complete this request.');
    }
    setTimeout(()=>setStatus('idle'), 6000);
    busy = false;
  }
}

  setDeep(null);
  busy = true;
  startTimer();

  switch(name){

    case 'help':
      await runStd(name, arg, {
        fetcher: async()=>({ list: COMMANDS.map(c=>'/'+c.name+' — '+c.desc).join('\n') }),
        sys: 'Explain the following commands briefly and clearly, each with a tiny usage example where useful. Keep it compact.',
        userLine: ()=>'The user opened the command list. Explain these commands:\n' + COMMANDS.map(c=>'/'+c.name+' — '+c.desc).join('\n'),
        errMsg:'⚠️ **Error found** — could not load the command list right now.'
      });
      break;

    case 'weather':
      await runStd(name, arg, {
        fetcher: fetchWeather,
        sys: 'You have live weather data for a place. Present it clearly: current conditions, wind, and the 3-day outlook. Be short and friendly.',
        userLine: (a)=>'The user asked about weather for: "' + a + '"',
        errMsg:'⚠️ **Error found** — could not fetch weather for that place.'
      });
      break;

    case 'ip':
      await runStd(name, arg, {
        fetcher: fetchIp,
        sys: 'You have live network/location info of the user. Explain it in friendly human terms: where their connection appears to be, provider, timezone.',
        userLine: ()=>'The user asked for their IP / connection info.',
        errMsg:'⚠️ **Error found** — could not read your network info.'
      });
      break;

    case 'crypto':
      await runStd(name, arg, {
        fetcher: fetchCrypto,
        sys: 'You have live crypto market data (price, 24h change, high, low, volume). Analyze it like a market analyst: current price, the 24h up/down move, quick context. Keep it compact. Do NOT show raw timestamps or chart arrays.',
        userLine: (a)=>'The user asked about this coin: "' + a + '"',
        card: live => coinCard(live),
        errMsg:'⚠️ **Error found** — could not fetch market data for that coin.'
      });
      break;

    case 'commodity':
      await runStd(name, arg, {
        fetcher: fetchCommodity,
        sys: 'You have live commodity market data (name, current price, change %, day high/low). Analyze it briefly like a market analyst: the current price level, the 24h move, and one short note on what typically drives this commodity. Keep it compact.',
        userLine: (a)=>'The user asked about this commodity: "' + a + '"',
        card: live => commodityCard(live),
        errMsg:'⚠️ **Error found** — could not fetch data for that commodity. Try gold, silver, oil, gas…'
      });
      break;

    case 'time':
      await runStd(name, arg, {
        fetcher: async()=>fetchTime(),
        sys: 'You have the exact current time data. Answer when asked about the time, timezone or date.',
        userLine: (a)=>'The user asked: "' + (a||'current time') + '"',
        errMsg:'⚠️ **Error found** — could not compute the time.'
      });
      break;

    case 'iss':
      await runStd(name, arg, {
        fetcher: fetchIss,
        sys: 'You have the LIVE location of the ISS. Explain where the ISS is right now, the exact coordinates. Make it exciting and brief.',
        userLine: ()=>'The user asked for the live ISS location.',
        errMsg:'⚠️ **Error found** — could not reach the ISS tracker right now.'
      });
      break;

    case 'joke':
      await runStd(name, arg, {
        fetcher: fetchJoke,
        sys: 'You have a joke (setup + punchline). Present it with great timing. Keep it natural.',
        userLine: ()=>'Tell the user this joke with style:',
        errMsg:'⚠️ **Error found** — the joke box is empty right now.'
      });
      break;

    case 'wiki':
      await runStd(name, arg, {
        fetcher: fetchWiki,
        sys: 'You have a Wikipedia summary for the user. Explain the topic clearly and briefly using the extract. IMPORTANT: never include any links or URLs in your reply.',
        userLine: (a)=>'The user wants to know about: "' + a + '"',
        after: (live, a)=>{ setDeep({ query:a, url: live.url, title: live.title, kind:'wiki' }); },
        errMsg:'⚠️ **Error found** — could not find an article for that.'
      });
      break;

    case 'summarize': {
      if((arg||'').trim().length < 120){
        setStatus('idle'); stopTimer(); busy = false;
        addAI('Paste a longer text after **/summarize** (at least a few sentences) and I will shrink it down for you ✂️');
        return;
      }
      setStatus('think');
      thinkTimer = setTimeout(()=>setStatus('work'), 7000);
      try{
        const chunks = [];
        let s = arg.trim();
        while(s.length > 0){
          if(s.length <= 2600){ chunks.push(s); break; }
          let cut = s.lastIndexOf('.', 2600);
          if(cut < 300) cut = s.lastIndexOf(' ', 2600);
          chunks.push(s.slice(0, cut+1));
          s = s.slice(cut+1);
        }
        const sums = [];
        for(const c of chunks){
          sums.push(await groqChat([
            { role:'system', content:'Summarize the following text in 2-3 short sentences. Keep key facts and numbers.' },
            { role:'user', content:c }
          ], 300));
        }
        const reply = await groqChat([
          { role:'system', content:'Combine these partial summaries into one clean, well-structured summary with a short heading. Use **bold** for the most important point.' },
          { role:'user', content: sums.join('\n---\n') }
        ]);
        clearTimeout(thinkTimer);
        const t = stopTimer();
        setStatus('idle');
        addAI(reply, null, t);
        pushHistory('assistant', reply);
        busy = false;
      }catch(e){
        clearTimeout(thinkTimer); stopTimer();
        if(e && e.type === 'network'){ setStatus('net'); addAI('⚠️ **Network connection error** — check your internet and try again.'); }
        else { setStatus('error'); addAI('⚠️ **Error found** — could not summarize that text.'); }
        setTimeout(()=>setStatus('idle'), 6000);
        busy = false;
      }
      break;
    }

    case 'image':
      await runStd(name, arg, {
        fetcher: genImage,
        sys: 'Image generation succeeded — just acknowledge it briefly. Do not paste any URLs.',
        userLine: (a)=>'The user asked for an image of: "' + a + '"',
        card: live => imageCard(live.src, { upscale:true, prompt:arg }),
        errMsg:'⚠️ **Error found** — the image maker is busy. Try a different description or try again.'
      });
      break;

    case 'qr':
      await runStd(name, arg, {
        fetcher: fetchQr,
        sys: 'A QR code was generated for the user\'s content. Acknowledge it in one short line. Do not paste any URLs.',
        userLine: (a)=>'The user generated a QR code for: "' + a + '"',
        card: live => imageCard(live.src, { upscale:false, prompt:null }),
        errMsg:'⚠️ **Error found** — could not make a QR code for that.'
      });
      break;

    case 'barcode':
      await runStd(name, arg, {
        fetcher: fetchBarcode,
        sys: 'A barcode was generated for the user\'s content. Acknowledge it in one short line. Do not paste any URLs.',
        userLine: (a)=>'The user generated a barcode for: "' + a + '"',
        card: live => imageCard(live.src, { upscale:false, prompt:null }),
        errMsg:'⚠️ **Error found** — could not make a barcode for that.'
      });
      break;

    case 'qrread':
    case 'barcoderead': {
      const isQR = name === 'qrread';
      setStatus('think');
      thinkTimer = setTimeout(()=>setStatus('work'), 5000);
      const file = await pickImage();
      if(!file){
        clearTimeout(thinkTimer); setStatus('idle'); stopTimer(); busy = false;
        return;
      }
      addUser((isQR?'/qrread':'/barcoderead') + ' 📷', '<img class="um-img" src="'+URL.createObjectURL(file)+'" alt="Code image">');
      const text = isQR ? await decodeQR(file) : await decodeBarcode(file);
      clearTimeout(thinkTimer);
      const t = stopTimer();
      setStatus('idle');
      if(text){
        addAI('✅ **'+(isQR?'QR code':'Barcode')+' decoded:**\n```\n'+text+'\n```', null, t);
        pushHistory('assistant', 'Decoded: '+text);
      }else{
        addAI('⚠️ I could not find a '+(isQR?'QR code':'barcode')+' in that image. Try a clearer, closer photo.', null, t);
      }
      busy = false;
      break;
    }

    case 'calc': {
      let live = null;
      try{ live = calcExpr(arg); }
      catch(e){
        busy = false; stopTimer();
        await modelAnswer('/calc '+(arg||''));
        return;
      }
      const t = stopTimer();
      setStatus('idle');
      const v = Number.isInteger(live.value) ? live.value.toLocaleString('en-US') : parseFloat(live.value.toFixed(6));
      const txt = '`'+escapeHtml(live.expr)+'` = **'+v+'**';
      addAI(txt, null, t);
      pushHistory('assistant', 'Result: '+v);
      busy = false;
      break;
    }

    case 'password': {
      const live = genPassword(arg);
      const t = stopTimer();
      setStatus('idle');
      addAI('Here is your secure password (**'+live.length+' characters**):\n```\n'+live.password+'\n```\nKeep it safe 🔒', null, t);
      pushHistory('assistant', 'Generated password');
      busy = false;
      break;
    }

    case 'currency':
      await runStd(name, arg, {
        fetcher: fetchCurrency,
        sys: 'You have live currency conversion data. Present the conversion clearly with the exchange rate. Keep it short.',
        userLine: (a)=>'The user wants a currency conversion: "' + a + '"',
        errMsg:'⚠️ **Error found** — could not convert that currency.'
      });
      break;

    case 'translate':
      await runStd(name, arg, {
        fetcher: fetchTranslate,
        sys: 'You have a translation result. Present it cleanly: original text, language, translation. Do not add extra commentary.',
        userLine: (a)=>'The user wants to translate: "' + a + '"',
        errMsg:'⚠️ **Error found** — could not translate that.'
      });
      break;

    case 'news':
      await runStd(name, arg, {
        fetcher: fetchNews,
        sys: 'You have the top 10 tech news stories (Hacker News). Summarize the most interesting 5 in one or two lines each, then list the rest as titles. Keep it compact.',
        userLine: ()=>'The user wants the top tech news stories.',
        errMsg:'⚠️ **Error found** — could not load the news right now.'
      });
      break;

    case 'dictionary':
      await runStd(name, arg, {
        fetcher: fetchDictionary,
        sys: 'You have dictionary data for a word (definition, phonetic, part of speech). Present the meaning cleanly and briefly.',
        userLine: (a)=>'The user wants the meaning of: "' + a + '"',
        errMsg:'⚠️ **Error found** — could not find that word.'
      });
      break;
  }
}

/* ---------------- SEND ---------------- */
function send(){
  const text = input.value.trim();
  if(!text) return;
  if(busy){ toastMsg('Thing is still responding…'); return; }
  input.value = '';
  autoGrow();
  popup.classList.remove('show');
  if(text.charAt(0) === '/'){
    const m = text.split(/\s+/);
    const cmdName = m[0].slice(1).toLowerCase();
    const arg = m.slice(1).join(' ');
    addUser(text);
    runCommand(cmdName, arg);
  }else{
    addUser(text);
    if(getDeep() && deepIntent(text)){
      deepAnswer(text);
    }else{
      modelAnswer(text);
    }
  }
}

/* ---------------- POPUPS ---------------- */
function renderPopup(filter){
  const list = COMMANDS.filter(c => c.name.indexOf(filter) === 0);
  if(!list.length){ popup.classList.remove('show'); return; }
  popup.innerHTML = list.map(c =>
    '<div class="sp-item" data-cmd="'+c.name+'">' +
      '<span class="cmd-ic">'+c.icon+'</span>' +
      '<div><div class="cmd-name">/'+c.name+'</div><div class="cmd-desc">'+c.desc+'</div></div>' +
    '</div>'
  ).join('');
  popup.classList.add('show');
}
function renderComPopup(filter){
  const f = (filter||'').toLowerCase();
  const list = COMS.filter(c =>
    !f || c.id.indexOf(f) === 0 || c.n.toLowerCase().indexOf(f) !== -1 || (c.aliases||[]).some(a => a.indexOf(f) !== -1)
  );
  if(!list.length){ popup.classList.remove('show'); return; }
  popup.innerHTML = list.map(c =>
    '<div class="sp-item" data-com="'+c.id+'">' +
      '<span class="com-ic" style="background:'+c.c+'26">'+c.e+'</span>' +
      '<div><div class="cmd-name">'+escapeHtml(c.n)+'</div><div class="cmd-desc">live price + chart · '+escapeHtml(c.s)+'</div></div>' +
    '</div>'
  ).join('');
  popup.classList.add('show');
}
popup.addEventListener('click', e => {
  const it = e.target.closest('.sp-item');
  if(!it) return;
  if(it.dataset.cmd){
    input.value = input.value.replace(/\/([a-zA-Z]*)$/, '/' + it.dataset.cmd + ' ');
  }else if(it.dataset.com){
    input.value = input.value.replace(/\/commodity\s*[a-zA-Z ]*$/, '/commodity ' + it.dataset.com + ' ');
  }
  input.focus();
  popup.classList.remove('show');
  autoGrow();
});

/* ---------------- SETTINGS ---------------- */
function renderSettings(){
  const wt = $('#webTgl');
  if(wt) wt.classList.toggle('on', webOn);
  updateMemCount();
  hintBar.textContent = 'web search: ' + (webOn?'on':'off') + ' · type / for all commands · mic for voice · 📎 uploads an image';
}

/* ---------------- EVENTS ---------------- */
sendBtn.addEventListener('click', send);
input.addEventListener('keydown', e => {
  if(e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    send();
  }
});
input.addEventListener('input', () => {
  autoGrow();
  const line = input.value.split('\n').pop();
  let m = line.match(/^\/([a-zA-Z]*)$/);
  if(m){
    if(m[1] === 'commodity') renderComPopup('');
    else renderPopup(m[1]);
    return;
  }
  m = line.match(/^\/commodity\s+([a-zA-Z ]*)$/);
  if(m){ renderComPopup(m[1].trim()); return; }
  popup.classList.remove('show');
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){
    popup.classList.remove('show');
    closeSettings();
  }
});
function autoGrow(){
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 150) + 'px';
}

attachBtn.addEventListener('click', async () => {
  const file = await pickImage();
  if(file) handleUpload(file);
});

let sideOpen = window.matchMedia('(min-width: 761px)').matches;
function applySide(){
  document.body.classList.toggle('side-closed', !sideOpen);
}
function toggleSide(v){
  sideOpen = (typeof v === 'boolean') ? v : !sideOpen;
  applySide();
}
applySide();
$('#menuBtn').addEventListener('click', () => toggleSide());

$('#hideChats').addEventListener('click', () => {
  hiddenChats = !hiddenChats;
  document.body.classList.toggle('chat-hidden', hiddenChats);
  $('#hideChats').innerHTML = hiddenChats ? IC.eye : IC.eyeOff;
  toastMsg(hiddenChats ? 'Chats hidden' : 'Chats visible');
});

function openSettings(){
  settingsPanel.classList.add('open');
  overlay.classList.add('show');
}
function closeSettings(){
  settingsPanel.classList.remove('open');
  overlay.classList.remove('show');
}
$('#settingsBtn').addEventListener('click', openSettings);
$('#closeSettings').addEventListener('click', closeSettings);
overlay.addEventListener('click', closeSettings);

$('#webTgl').addEventListener('click', () => {
  webOn = !webOn;
  localStorage.setItem('thing_web', webOn ? '1' : '0');
  renderSettings();
  toastMsg(webOn ? 'Web search turned ON' : 'Web search turned OFF');
});

$('#newChatBtn').addEventListener('click', () => {
  if(busy){ toastMsg('Thing is still responding…'); return; }
  newChat();
});
chatList.addEventListener('click', e => {
  const del = e.target.closest('.ci-del');
  if(del){
    e.stopPropagation();
    deleteChat(del.dataset.id);
    return;
  }
  const item = e.target.closest('.chat-item');
  if(item) switchChat(item.dataset.id);
});
chatInner.addEventListener('click', e => {
  const ch = e.target.closest('.chip');
  if(ch){
    input.value = ch.dataset.txt;
    input.focus();
    autoGrow();
  }
});

$('#clearChat').addEventListener('click', () => {
  clearAllChats();
  toastMsg('All chats deleted');
  closeSettings();
});
$('#clearMem').addEventListener('click', () => {
  MEMORY = [];
  saveMemory();
  updateMemCount();
  toastMsg('Memory cleared — I forgot everything about you');
  closeSettings();
});

/* ---------------- INIT ---------------- */
loadChats();
if(!cur) newChat();
else { renderChatList(); renderChat(); }
renderSettings();
setStatus('idle');

})();
</script>
